<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182241"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4FD1A0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4FD1A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- circular background (Reddit crops to circle) -->
  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="128" fill="url(#glow)"/>
  <!-- subtle inner ring -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#4FD1A0" stroke-opacity="0.22" stroke-width="2"/>

  <!-- cv wordmark -->
  <text x="112" y="172" text-anchor="middle" font-family="'Poppins','DejaVu Sans',sans-serif" font-size="130" font-weight="700" fill="#F1F4FA" letter-spacing="-4">cv</text>
  <!-- cursor block -->
  <rect x="176" y="138" width="34" height="26" rx="5" fill="#4FD1A0"/>
</svg>
